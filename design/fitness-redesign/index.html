function head(title,sub,actions='',kicker=''){return `<header class="page-head"><div>${kicker?`<div class="eyebrow">${kicker}</div>`:''}<h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></header>`}

function render(){const page=location.hash.slice(1)||'plan';if(!draft&&page==='workout')draft=structuredClone(db.workouts[0]);if(!draft&&page==='day')draft=structuredClone(workout(selectedDay())||{id:'rest',items:[]});const section=['records','entry','insights'].includes(page)?'records':['library','exercise','new-exercise'].includes(page)?'library':'plan';document.querySelectorAll('[data-nav]').forEach(a=>{a.classList.toggle('active',a.dataset.nav===section);a.setAttribute('aria-current',a.dataset.nav===section?'page':'false')});$('#crumb').textContent={plan:'我的计划',rhythm:'我的计划 / 循环设置',workouts:'我的计划 / 训练内容',workout:'我的计划 / 编辑训练内容',day:'我的计划 / 调整这一天',records:'训练记录',entry:'训练记录 / 补录训练',insights:'训练记录 / 训练趋势',library:'动作库',exercise:'动作库 / 动作详情','new-exercise':'动作库 / 新建动作',welcome:'欢迎使用'}[page]||'我的计划';$('#main').innerHTML=(pages[page]||pages.plan)()+footer();window.scrollTo(0,0)}
function exerciseRows(items,actual=false){return `<div class="table-wrap"><table class="table"><thead><tr><th>动作</th><th>${actual?'实际组次':'目标组次'}</th><th>${actual?'实际重量':'参考重量'}</th><th>组间休息</th></tr></thead><tbody>${items.map(e=>`<tr><td><div class="exercise-inline">${image(e.id,'',exercise(e.id)?.name)}<b>${esc(exercise(e.id)?.name)}</b></div></td><td class="num">${e.sets} × ${e.id==='Plank'?e.reps+' 秒':e.reps+' 次'}</td><td class="num">${e.id==='Plank'?'—':e.weight+' kg'}</td><td class="num">${e.unit==='minutes'?+(e.rest/60).toFixed(2)+' 分钟':e.rest+' 秒'}</td></tr>`).join('')}</tbody></table></div>`}
function planPage(){const id=selectedDay(),w=workout(id),end=dateAt(state.cycle,db.rhythm.length-1);return head('我的计划','把训练安排好，按自己的节奏继续。',btn(icon('repeat')+'循环设置','rhythm')+btn(icon('library')+'训练内容','workouts'))+`<div class="intro"><div><span class="kicker">当前循环</span><h2>练 ${db.rhythm.filter(x=>x!=='rest').length} 天，休 ${db.rhythm.filter(x=>x==='rest').length} 天。</h2><p>从 ${dateShort(db.start)} 开始，每 ${db.rhythm.length} 天重复。某一天不一样？只改那一天就好。</p></div>${image('hero','art')}</div><div class="layout"><div class="stack"><section class="panel"><div class="panel-head"><div><h2>这一轮，怎么练</h2><p>点选一天，查看具体安排。</p></div><div class="cycle-nav"><button data-action="prev-cycle" aria-label="上一轮">‹</button><span>第 ${state.cycle+1} 轮 · ${dateShort(dateAt(state.cycle,0))}—${dateShort(end)}</span><button data-action="next-cycle" aria-label="下一轮">›</button></div></div><div class="days" style="--day-count:${Math.min(db.rhythm.length,4)}">${db.rhythm.map((base,i)=>{const key=db.overrides[state.cycle+'-'+i]||base,t=workout(key);return `<button class="day ${state.day===i?'selected':''}" data-action="select-day" data-index="${i}"><span class="date">${dateShort(dateAt(state.cycle,i))}${dateAt(state.cycle,i)==='2026-11-01'?pill('今天'):''}</span><b>${t?esc(t.name):'休息与恢复'}</b><small>${t?t.items.length+' 个动作':'给身体一点恢复时间'}</small>${image(t?.art||'peach','day-art')}<span class="bottom">${db.overrides[state.cycle+'-'+i]?'本次已单独调整':t?'沿用常用训练内容':'恢复日'}</span></button>`}).join('')}</div><div class="subtle-line">${icon('repeat')}下一轮会自动延续这套安排。</div></section><section class="panel"><div class="panel-head"><div><span class="kicker">${dateAt(state.cycle,state.day).replaceAll('-','.')} · 第 ${state.day+1} 天</span><h2 style="margin-top:6px">${w?esc(w.name):'今天，慢一点也很好。'}</h2></div>${btn(icon('edit')+'调整这一天','edit-day')}</div>${w?exerciseRows(w.items):`<div class="empty">${image('peach')}<p>这一天没有计划动作。你可以保持休息，也可以安排轻量活动。</p></div>`}<div class="table-note">${icon('info')} 这里是训练安排，不会自动生成实际训练记录。</div></section></div><aside class="stack"><section class="panel quiet"><h3>开始使用，只需要三步</h3><ol class="help-steps" style="margin-top:20px"><li><b>先确定循环节奏</b>例如练三休一，不必按周安排。</li><li><b>准备常练的训练内容</b>如“胸肩三头”，保存一份反复用。</li><li><b>每一轮，按需要微调</b>想换动作或临时休息，只调整那一天。</li></ol></section><section class="panel"><h3>这一轮的调整</h3><p class="helper" style="margin:10px 0 16px">${Object.keys(db.overrides).filter(k=>k.startsWith(state.cycle+'-')).length?'已经单独调整过的日期，会在计划里标记。':'目前沿用常规安排，没有单独调整的日期。'}</p>${Object.entries(db.overrides).filter(([k])=>k.startsWith(state.cycle+'-')).map(([k,id])=>`<div class="record-exercise"><span>${dateShort(dateAt(state.cycle,+k.split('-')[1]))}</span><small>${esc(workout(id)?.name||'休息与恢复')}</small></div>`).join('')}<p class="small-note">要修改时，点选左侧日期，再选择“调整这一天”。</p></section></aside></div>`}
function rhythmPage(){return `<div class="narrow"><a class="back" href="#plan">${icon('back')}返回我的计划</a>`+head('设置你的循环','只决定训练与休息如何轮换，不会改动过去的训练记录。')+`<div class="stepper">${['选择节奏','安排训练日','确认循环'].map((t,i)=>`<span class="${state.step===i+1?'active':''}"><i>${i+1}</i>${t}</span>`).join('')}</div><section class="panel">${state.step===1?`<div class="form-section"><h2>你习惯怎么练？</h2><p class="helper" style="margin:7px 0 24px">选一个接近的节奏，之后随时可以改。</p><div class="rhythm-presets">${[[3,1],[2,1],[4,1]].map(([t,r])=>`<button class="rhythm-choice ${state.trainDays===t&&state.restDays===r?'active':''}" data-action="rhythm-preset" data-train="${t}" data-rest="${r}"><b>练${t}休${r}</b><small>${t+r}天一个循环</small></button>`).join('')}</div><details class="advanced"><summary>自定义训练天数与休息天数</summary><div class="form-grid"><label>连续训练天数<input id="train-days" type="number" min="1" max="14" value="${state.trainDays}"></label><label>接着休息天数<input id="rest-days" type="number" min="1" max="7" value="${state.restDays}"></label></div></details></div>`:state.step===2?`<h2>把常练的内容放到训练日</h2><p class="helper" style="margin-top:7px">每一轮先按这个顺序安排；某一轮想换，可以单独调整。</p><div class="rhythm-days">${Array.from({length:state.trainDays+state.restDays},(_,i)=>`<div class="rhythm-tile ${i>=state.trainDays?'rest':''}"><small>第 ${i+1} 天</small><select class="rhythm-select" aria-label="第${i+1}天训练内容">${db.workouts.map((w,n)=>`<option value="${w.id}" ${i<state.trainDays&&n===i%db.workouts.length?'selected':''}>${esc(w.name)}</option>`).join('')}<option value="rest" ${i>=state.trainDays?'selected':''}>休息与恢复</option></select></div>`).join('')}</div><p class="small-note">还没准备好动作组合？可以先使用示例内容，稍后在“训练内容”里修改。</p>`:`<h2>就按这个节奏，开始安排。</h2><div class="form-grid" style="margin:25px 0"><label>循环起始日期<input id="rhythm-start" type="date" value="${db.start}"></label><label>循环规则<input value="训练 ${state.trainDays} 天，再休息 ${state.restDays} 天" readonly></label></div><div class="rhythm-days">${state.pendingRhythm.map((id,i)=>`<div class="rhythm-tile ${id==='rest'?'rest':''}"><small>第 ${i+1} 天</small><b>${esc(workout(id)?.name||'休息')}</b></div>`).join('')}</div><div class="form-note">从选择的日期开始生成新的循环。之前已补录的训练记录保持不变。</div>`}<div class="form-actions">${btn(state.step===1?'取消':'上一步',state.step===1?'plan':'rhythm-back')}${btn(state.step===3?icon('check')+'保存循环':'下一步 '+icon('arrow'),state.step===3?'rhythm-save':'rhythm-next','','primary')}</div></section></div>`}
function workoutsPage(){return `<a class="back" href="#plan">${icon('back')}返回我的计划</a>`+head('常用训练内容','把一整天的动作存成一份内容，例如“背 · 二头”，再复用到计划里。',btn(icon('plus')+'新建训练内容','new-workout','','primary'))+`<div class="workouts">${db.workouts.map(w=>`<article class="workout-card">${image(w.art)}<h3>${esc(w.name)}</h3><p>${w.items.length} 个动作 · ${w.items.reduce((s,e)=>s+e.sets,0)} 组</p><div class="workout-preview">${w.items.slice(0,3).map(e=>esc(exercise(e.id)?.name)).join('<br>')}${w.items.length>3?'<br><span class="muted">另有 '+(w.items.length-3)+' 个动作</span>':''}</div><footer><small>在计划中按天选用</small>${btn('编辑内容 '+icon('arrow'),'edit-workout',`data-id="${w.id}"`,'small')}</footer></article>`).join('')}</div><div class="form-note" style="margin-top:24px">${icon('info')} 这里专注编辑动作组合。哪一天使用哪份内容，在“我的计划”里安排。</div>`}
function editItems(items){return `<div class="table-wrap"><table class="table edit-table"><thead><tr><th>动作</th><th style="width:80px">组数</th><th style="width:90px">每组次数</th><th style="width:130px">参考重量</th><th style="width:165px">组间休息</th><th></th></tr></thead><tbody>${items.map((e,i)=>`<tr><td><div class="exercise-inline">${image(e.id)}<b>${esc(exercise(e.id)?.name)}</b></div></td><td><input data-field="sets" data-index="${i}" type="number" min="1" value="${e.sets}" aria-label="${esc(exercise(e.id)?.name)}组数"></td><td><input data-field="reps" data-index="${i}" type="number" min="1" value="${e.reps}" aria-label="每组次数"></td><td><div class="combined"><input data-field="weight" data-index="${i}" type="number" min="0" step="any" value="${e.weight}" aria-label="参考重量"><span class="unit">kg</span></div></td><td><div class="combined"><input data-field="rest" data-index="${i}" type="number" min="0" step="any" value="${e.unit==='minutes'?+(e.rest/60).toFixed(3):e.rest}" aria-label="休息时间"><select data-field="unit" data-index="${i}" aria-label="休息单位"><option value="seconds" ${e.unit!=='minutes'?'selected':''}>秒</option><option value="minutes" ${e.unit==='minutes'?'selected':''}>分钟</option></select></div></td><td><button class="delete" data-action="remove-item" data-index="${i}" aria-label="移除动作">×</button></td></tr>`).join('')}</tbody></table></div>`}
function workoutPage(){return `<a class="back" href="#workouts">${icon('back')}返回训练内容</a>`+head(draft.isNew?'新建训练内容':'编辑训练内容','只在这里编辑动作组合，不必重复配置循环。')+`<form id="workout-form" class="panel"><div class="form-grid" style="margin-bottom:25px"><label>训练内容名称<input id="workout-name" value="${esc(draft.name)}" placeholder="例如：胸 · 肩 · 三头" required></label><label>训练分类<select id="workout-tag">${['推','拉','腿','全身','有氧','自定义'].map(t=>`<option ${t===draft.tag?'selected':''}>${t}</option>`).join('')}</select></label></div><div class="panel-head"><h2>动作安排</h2><small>重量和次数都是参考目标。</small></div>${editItems(draft.items)}<button class="text-button" data-action="pick-exercise" style="margin:18px 0">${icon('plus')}从动作库添加</button><details class="advanced"><summary>更多设置：训练备注</summary><label style="margin-top:17px">训练备注<textarea id="workout-notes">${esc(draft.notes)}</textarea></label></details><div class="form-actions">${btn('取消','workouts')}<button class="button primary" type="submit">${icon('check')}保存训练内容</button></div></form>`}
function dayPage(){const date=dateAt(state.cycle,state.day);return `<div class="narrow"><a class="back" href="#plan">${icon('back')}返回我的计划</a>`+head('调整这一天',`${date.replaceAll('-','.')} · 第 ${state.cycle+1} 轮，第 ${state.day+1} 天。修改计划，不等于记录训练。`)+`<section class="panel"><div class="form-section"><label>这一天安排什么？<select id="day-workout">${draft.id!=='rest'&&!db.workouts.some(w=>w.id===draft.id)?`<option value="${draft.id}" selected>${esc(draft.name)}（当日调整）</option>`:''}${db.workouts.map(w=>`<option value="${w.id}" ${draft.id===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}<option value="rest" ${draft.id==='rest'?'selected':''}>休息与恢复</option></select></label><div id="day-items" style="margin-top:20px">${draft.id==='rest'?'<p class="helper">保持恢复日，不安排训练动作。</p>':exerciseRows(draft.items)}</div><details class="advanced"><summary>只想修改个别动作？展开当日动作编辑</summary><div style="margin-top:18px" id="day-edit">${draft.id==='rest'?'休息日没有动作。':editItems(draft.items)+`<button class="text-button" data-action="pick-exercise" style="margin-top:15px">${icon('plus')}添加动作</button>`}</div></details></div><div class="form-section"><h3>修改影响哪些天？</h3><div class="scope"><label class="radio-choice"><input name="scope" type="radio" value="one" checked><span><strong>仅这一天</strong><small>后面的循环继续沿用原安排。</small></span></label><label class="radio-choice"><input name="scope" type="radio" value="future"><span><strong>今后每轮的同一天</strong><small>从这一轮起，每轮第 ${state.day+1} 天都这样安排。</small></span></label></div></div><div class="form-actions">${btn('取消','plan')}${btn(icon('check')+'保存调整','save-day','','primary')}</div></section></div>`}
function recordTabs(){return `<div class="tabs" aria-label="记录查看方式">${[['calendar','日历'],['list','列表'],['insights','趋势']].map(([v,t])=>`<button class="${state.recordView===v?'active':''}" data-action="record-view" data-view="${v}">${t}</button>`).join('')}</div>`}
function recordsPage(){if(state.recordView==='insights')return insightsPage();const rs=db.records.filter(r=>r.date.startsWith(state.month)),r=db.records.find(r=>r.id===state.recordId);return head('训练记录','记录实际完成的训练。没有记录的日子，不会自动判断为休息。',btn(icon('plus')+'补录训练','new-record','','primary'))+`<div class="toolbar">${recordTabs()}<div class="month-control"><button data-action="month-prev" aria-label="上个月">‹</button>${state.month.replace('-',' 年 ')} 月<button data-action="month-next" aria-label="下个月">›</button></div></div><div class="layout"><section class="panel">${state.recordView==='calendar'?calendarMarkup(rs):recordList(rs)}<div class="table-note">本月 ${rs.length} 次已记录训练 · ${rs.reduce((a,r)=>a+(r.minutes||0),0)} 分钟</div></section><aside class="stack"><section class="panel">${r?recordDetail(r):`<div class="empty">${image('note-character')}<h3>这一天还没有记录</h3><p>练过之后再来补录，或者先选一个有记录的日期看看。</p>${btn('补录训练','new-record','','primary')}</div>`}</section><section class="panel quiet"><h3>记录与计划，各有分工</h3><p class="helper" style="margin-top:10px">计划是“准备怎么练”，记录是“实际练了什么”。补录时可以带入计划，再按实际情况修改。</p><details class="advanced"><summary>数据管理</summary><p class="helper" style="margin-top:12px">历史数据导入、导出统一放在这里，日常补录不需要使用。</p><div class="actions" style="margin-top:12px">${btn('导出示例记录','export-demo','','small')}${btn('导入说明','import-info','','small')}</div></details></section></aside></div>`}
function calendarMarkup(rs){const [y,m]=state.month.split('-').map(Number),offset=(new Date(y,m-1,1).getDay()+6)%7,days=new Date(y,m,0).getDate();return `<div class="calendar">${['一','二','三','四','五','六','日'].map(t=>`<span class="weekday">${t}</span>`).join('')}${Array.from({length:Math.ceil((offset+days)/7)*7},(_,i)=>{const n=i-offset+1,dt=new Date(y,m-1,n,12),date=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'),records=rs.filter(r=>r.date===date);return `<button class="cell ${n<1||n>days?'outside':''} ${db.records.find(r=>r.id===state.recordId)?.date===date?'selected':''}" data-action="calendar-day" data-date="${date}"><span class="daynum">${dt.getDate()}</span>${records.map(r=>`<span class="event ${r.workout==='pull'?'lavender':r.workout==='legs'?'peach':''}">${esc(r.title)}</span>`).join('')}</button>`}).join('')}</div>`}
function recordList(rs){return `<table class="table"><thead><tr><th>日期</th><th>训练内容</th><th>动作</th><th>用时</th><th></th></tr></thead><tbody>${[...rs].reverse().map(r=>`<tr><td class="num">${dateShort(r.date)}</td><td>${esc(r.title)}</td><td class="num">${r.items.length} 个</td><td class="num">${r.minutes||'—'} 分钟</td><td><button class="text-button" data-action="select-record" data-id="${r.id}">查看 ${icon('chevron')}</button></td></tr>`).join('')}</tbody></table>${!rs.length?'<div class="empty">本月还没有训练记录。</div>':''}`}
function recordDetail(r){return `<span class="kicker">${r.date.replaceAll('-','.')} · 实际训练</span><h2 class="record-title">${esc(r.title)}</h2><div class="record-meta"><span>${r.items.length} 个动作</span><span>${r.items.reduce((a,e)=>a+e.sets,0)} 组</span><span>${r.minutes||'—'} 分钟</span></div>${r.items.map(e=>`<div class="record-exercise"><span>${esc(exercise(e.id)?.name)}</span><small>${e.sets} × ${e.reps}　${e.weight} kg</small></div>`).join('')}<p class="record-note">${esc(r.notes)||'没有填写备注。'}</p><button class="text-button" data-action="edit-record" data-id="${r.id}">${icon('edit')}修改这条记录</button>`}
function newRecord(edit){const w=workout(db.rhythm[state.day])||db.workouts[0];state.source=edit?'blank':'plan';state.newRecord=edit?structuredClone(edit):{id:'r'+Date.now(),date:'2026-11-01',title:w.name,workout:w.id,minutes:'',notes:'',items:structuredClone(w.items)};go('entry');if(location.hash==='#entry')render()}
function entryPage(){const r=state.newRecord;if(!r)return `<div class="empty">请从训练记录中点击“补录训练”。${btn('前往训练记录','records')}</div>`;return `<a class="back" href="#records">${icon('back')}返回训练记录</a>`+head('补录一次训练','记下实际完成的内容。只填日期和名称也可以，其他都选填。')+`<form id="record-form"><div class="layout"><div class="stack"><section class="panel"><h2 style="margin-bottom:24px">基本信息</h2><div class="form-grid four"><label>训练日期<input id="record-date" type="date" value="${r.date}" required></label><label>训练名称<input id="record-title" value="${esc(r.title)}" placeholder="例如：周四背部训练" required></label><label>用时（选填）<div class="combined"><input id="record-minutes" type="number" min="0" value="${r.minutes}" placeholder="分钟"></div></label><label>训练分类<select id="record-kind">${db.workouts.map(w=>`<option value="${w.id}" ${w.id===r.workout?'selected':''}>${esc(w.name)}</option>`).join('')}</select></label></div></section><section class="panel"><div class="panel-head"><div><h2>实际动作</h2><p>带入后请按实际完成情况调整，不是实时训练打卡。</p></div>${btn('清空动作','clear-record-items','','small')}</div><div class="record-source">${btn('带入当日计划','record-source',`data-source="plan"`,state.source==='plan'?'soft':'')}${btn('选择常用训练内容','record-source',`data-source="workout"`,state.source==='workout'?'soft':'')}${btn(icon('plus')+'单独添加动作','pick-record-exercise')}</div>${r.items.length?`<div class="form-note" style="margin-bottom:20px">已带入 ${r.items.length} 个动作。点开某个动作，可以逐组填写实际重量与次数。</div>${r.items.map((e,i)=>`<details class="record-set" ${i===0?'open':''}><summary><span>${esc(exercise(e.id)?.name)}</span><small>${e.sets} 组 · ${e.weight} kg × ${e.reps} 次　⌄</small></summary>${Array.from({length:e.sets},(_,n)=>`<div class="set-no">第 ${n+1} 组</div><div class="form-grid three"><label>实际重量（kg）<input type="number" step="any" min="0" value="${e.actualSets?.[n]?.weight??e.weight}" data-actual="weight" data-index="${i}" data-set="${n}"></label><label>实际次数<input type="number" min="0" value="${e.actualSets?.[n]?.reps??e.reps}" data-actual="reps" data-inde function insightsPage(){const rs=db.records.filter(r=>r.date.startsWith(state.month)),count=rs.length,minutes=rs.reduce((s,r)=>s+(+r.minutes||0),0),vol=rs.reduce((s,r)=>s+r.items.reduce((a,e)=>a+e.weight*e.reps*e.sets,0),0),values=[0,0,0,0];rs.forEach(r=>values[Math.min(3,Math.floor((+r.date.slice(-2)-1)/8))]++);const max=Math.max(...values,1),action=exercise(state.progressId)||catalog[0],history=db.records.filter(r=>r.items.some(e=>e.id===action.id)),historyValues=history.map(r=>r.items.find(e=>e.id===action.id).weight);return head('训练记录','日常看记录，想了解变化时，再看看趋势。',btn(icon('plus')+'补录训练','new-record','','primary'))+`<div class="toolbar">${recordTabs()}<div class="month-control"><button data-action="month-prev" aria-label="上个月">‹</button>${state.month.replace('-',' 年 ')} 月<button data-action="month-next" aria-label="下个月">›</button></div></div><div class="metrics"><div class="metric"><div class="label">已记录训练</div><strong>${count}<small>次</small></strong><p>只统计实际补录</p></div><div class="metric"><div class="label">累计训练时间</div><strong>${Math.floor(minutes/60)}<small>小时 ${minutes%60} 分钟</small></strong><p>仅计填写用时的记录</p></div><div class="metric"><div class="label">累计训练容量</div><strong>${(vol/1000).toFixed(1)}<small>吨</small></strong><p>重量 × 次数 × 组数</p></div><div class="metric"><div class="label">有记录的天数</div><strong>${new Set(rs.map(r=>r.date)).size}<small>天</small></strong><p>无记录不代表未训练</p></div></div><div class="chart-layout"><section class="panel"><div class="panel-head"><div><h2>训练节奏</h2><p>本月每个时段记录了多少次训练。</p></div>${pill('次数')}</div><div class="bar-chart" role="img" aria-label="本月四个时段的训练次数">${values.map((v,i)=>`<div class="bar-item"><small>${v} 次</small><div class="bar" style="height:${v/max*150}px"></div><span>${['1—8日','9—16日','17—24日','25日以后'][i]}</span></div>`).join('')}</div></section><section class="panel"><h2>训练类型</h2><p class="helper" style="margin-top:5px">不同训练内容的记录分布。</p><div class="donut" style="background:${distribution(rs)}"><div><strong>${count}</strong><small>次 function lineChart(records,values){const style=getComputedStyle($('#main')),width=Math.max(280,$('#main').clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight)-48);const hi=Math.max(...values,1)*1.25,low=Math.min(0,...values),xs=values.map((v,i)=>55+i*((width-85)/Math.max(values.length-1,1))),ys=values.map(v=>210-(v-low)/(hi-low)*170);return `<svg class="chart" viewBox="0 0 ${width} 260" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${esc(exercise(state.progressId)?.name)}历次工作重量，单位千克"><text x="18" y="25">kg</text>${[0,1,2,3].map(i=>`<line class="gridline" x1="60" x2="${width-20}" y1="${210-i*55}" y2="${210-i*55}"/><text x="16" y="${214-i*55}">${(hi/3*i).toFixed(0)}</text>`).join('')}<polyline points="${xs.map((x,i)=>x+','+ys[i]).join(' ')}" fill="none" stroke="#5c865c" stroke-width="2.5"/>${xs.map((x,i)=>`<circle cx="${x}" cy="${ys[i]}" r="5" fill="#fff" stroke="#5c865c" stroke-width="2"/><text text-anchor="middle" x="${x}" y="${ys[i]-15}">${values[i]} kg</text><text text-anchor="middle" x="${x}" y="240">${dateShort(records[i].date)}</text>`).join('')}</svg>`}

plan:()=>go('plan'),records:()=>{state.recordView='calendar';go('records')},library:()=>go('library'),workouts:()=>go('workouts'),rhythm:()=>{state.step=1;state.trainDays=db.rhythm.filter(x=>x!=='rest').length;state.restDays=db.rhythm.filter(x=>x==='rest').length;go('rhythm')},'start-rhythm':()=>{state.step=1;go('rhythm')},'first-use':()=>go('welcome'),'prev-cycle':()=>{state.cycle=Math.max(0,state.cycle-1);render()},'next-cycle':()=>{state.cycle++;render()},'select-day':el=>{state.day=+el.dataset.index;render()},'edit-day':()=>{const w=workout(selectedDay());draft=w?structuredClone(w):{id:'rest',name:'休息',items:[]};go('day')},'edit-workout':el=>{state.editWorkout=el.dataset.id;draft=structuredClone(workout(el.dataset.id));go('workout')},'new-workout':()=>{draft={id:'w'+Date.now(),name:'',tag:'自定义',notes:'',art:'mint',items:[],isNew:true};go('workout')},'rhythm-preset':el=>{state.trainDays=+el.dataset.train;state.restDays=+el.dataset.rest;render()},'rhythm-next':()=>{if(state.step===1){state.trainDays=Math.max(1,Math.min(14,+$('#train-days').value));state.restDays=Math.max(1,Math.min(7,+$('#rest-days').value))}else{state.pendingRhythm=[...document.querySelectorAll('.rhythm-select')].map(e=>e.value);state.trainDays=state.pendingRhythm.filter(id=>id!=='rest').length;state.restDays=state.pendingRhythm.filter(id=>id==='rest').length}state.step++;render()},'rhythm-back':()=>{state.step--;render()},'rhythm-save':()=>{db.rhythm=state.pendingRhythm;db.start=$('#rhythm-start').value||db.start;db.overrides={};state.cycle=0;state.day=0;save();go('plan');toast('循环已保存，过去的记录保持不变')},'save-day':()=>{const future=$('input[name=scope]:checked').value==='future';let id=draft.id;if(draft.items?.length&&draft.id!=='rest'&&JSON.stringify(draft.items)!==JSON.stringify(workout(draft.id)?.items)){const custom={...structuredClone(draft),id:'day'+Date.now(),name:draft.name+' · 调整版'};db.dayContents||={};db.dayContents[custom.id]=custom;id=custom.id}if(future){for(let c=0;c<state.cycle;c++)if(!db.overrides[c+'-'+state.day])db.overrides[c+'-'+state.day]=db.rhythm[state.day];db.rhythm[state.day]=id;for(const k of Object.keys(db.overrides))if(+k.split('-')[0]>=state.cycle&&+k.split('-')[1]===state.day)delete db.overrides[k]}else db.overrides[state.cycle+'-'+state.day]=id;save();go('plan');toast(future?'已更新今后每轮的这一天':'只修改了这一天，其他循环保持原样')},'remove-item':el=>{syncDraft();draft.items.splice(+el.dataset.index,1);render()},'pick-exercise':()=>{syncDraft();picker(false)},'pick-record-exercise':()=>{syncDraft();picker(true)},'add-picked':el=>{const e=item(el.dataset.id,0,10);if(state.pickerRecord)state.newRecord.items.push(e);else draft.items.push(e);$('#dialog').close();render();toast('已添加 '+exercise(el.dataset.id).name)},'record-view':el=>{state.recordView=el.dataset.view;render()},'month-prev':()=>shiftMonth(-1),'month-next':()=>shiftMonth(1),'calendar-day':el=>{state.recordId=db.records.find(r=>r.date===el.dataset.date)?.id;state.pickedDate=el.dataset.date;render()},'select-record':el=>{state.recordId=el.dataset.id;render()},'new-record':()=>{newRecord();if(state.pickedDate){state.newRecord.date=state.pickedDate;render()}},'edit-record':el=>newRecord(db.records.find(r=>r.id===el.dataset.id)),'clear-record-items':()=>{syncDraft();state.newRecord.items=[];render()},'record-source':el=>{syncDraft();state.source=el.dataset.source;if(state.source==='workout'){showDialog('选择一份常用训练内容',db.workouts.map(w=>`<button class="pick-row" data-action="use-record-workout" data-id="${w.id}">${image(w.art)}<span><b>${esc(w.name)}</b><small>${w.items.length} 个动作</small></span>${icon('chevron')}</button>`).join(''))}else{const w=workout(db.rhythm[state.day])||db.workouts[0];state.newRecord.items=structuredClone(w.items);state.newRecord.title=w.name;state.newRecord.workout=w.id;render();toast('已带入计划，请按实际完成情况调整')}},'use-record-workout':el=>{const w=workout(el.dataset.id);state.newRecord.items=structuredClone(w.items);state.newRecord.title=w.name;state.newRecord.workout=w.id;$('#dialog').close();render()},'library-part':el=>{state.libraryPart=el.dataset.part;render()},favorites:()=>{state.fav=!state.fav;render()},'exercise-detail':el=>{state.exerciseId=el.dataset.id;go('exercise')},'toggle-favorite':el=>{const i=state.favorites.indexOf(el.dataset.id);i<0?state.favorites.push(el.dataset.id):state.favorites.splice(i,1);db.favorites=state.favorites;save();render()},'new-exercise':()=>go('new-exercise'),'save-exercise-note':el=>{db.notes||={};db.notes[el.dataset.id]=$('#exercise-note').value;save();toast('动作笔记已保存')},'close-dialog':()=>$('#dialog').close(),'compare-records':()=>{const rs=db.records.filter(r=>r.items.some(e=>e.id===state.progressId));if(rs.length<2){toast('需要至少两次该动作的记录，才能对比');return}state.compareRecords=rs;showDialog('两次训练，放在一起看',`<p class="helper" style="margin-bottom:20px">${esc(exercise(state.progressId)?.name)} · 相同动作与单位</p><div class="form-grid"><label>第一次<select id="compare-a">${rs.map((r,i)=>`<option value="${r.id}" ${i===0?'selected':''}>${r.date}</option>`).join('')}</select></label><label>第二次<select id="compare-b">${rs.map((r,i)=>`<option value="${r.id}" ${i===rs.length-1?'selected':''}>${r.date}</option>`).join('')}</select></label></div><div id="compare-result" style="margin-top:24px"></div>`);updateCompare()},'export-demo':()=>{const blob=new Blob([JSON.stringify(db.records,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='拾光-设计稿示例记录.json';a.click();URL.revokeObjectURL(a.href);toast('已导出设计稿中的示例数据')},'import-info':()=>showDialog('历史记录导入',`<div class="design-list"><div><b>低频操作，收进数据管理</b><p>正式应用中，导入历史记录会先展示预览，确认后再保存。本设计稿只演示这个入口的位置，不连接现有数据库。</p></div></div>`),'design-info':()=>showDialog('这版设计，如何变简单？',`<div class="design-list"><div><b>三个主入口，各司其职</b><p>我的计划：安排未来。训练记录：记录与回顾实际训练。动作库：查找和了解动作。</p></div><div><b>同一件事，只在一个地方管理</b><p>循环设置只定义节奏；训练内容只编辑动作组合；哪天使用哪份内容，在计划中调整。取消到处出现的“应用模板”面板。</p></div><div><b>先做基本操作，再展开进阶设置</b><p>新用户用三步建立循环。修改某一天时，默认只影响这一天；逐组记录、训练备注和数据管理按需展开。</p></div><div><b>回顾功能保留，导航更轻</b><p>日历、列表、趋势是同一份记录的三个视角。动作进步和两次对比放在趋势里，不再单独占用主页面。</p></div><div><b>本次交付范围</b><p>独立 HTML 交互设计稿。示例数据在当前浏览器本地保存，未修改正式应用。导入和实时训练同步不在本稿实现范围内。</p></div><div>${btn('重置示例数据','reset-demo','','small')}</div></div>`),'reset-demo':()=>{db=structuredClone(initial);state.cycle=0;state.day=0;state.recordId='r7';save();$('#dialog').close();go('plan');render();toast('已恢复示例数据')}};
function shiftMonth(n){const dt=new Date(state.month+'-01T12:00:00');dt.setMonth(dt.getMonth()+n);state.month=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');render()}
function updateCompare(){const a=db.records.find(r=>r.id===$('#compare-a').value).items.find(e=>e.id===state.progressId),b=db.records.find(r=>r.id===$('#compare-b').value).items.find(e=>e.id===state.progressId),av=a.weight*a.reps*a.sets,bv=b.weight*b.reps*b.sets;$('#compare-result').innerHTML=`<table class="table"><thead><tr><th>指标</th><th>第一次</th><th>第二次</th><th>变化</th></tr></thead><tbody><tr><td>工作重量</td><td>${a.weight} kg</td><td>${b.weight} kg</td><td>${b.weight-a.weight>=0?'+':''}${b.weight-a.weight} kg</td></tr><tr><td>组数 × 次数</td><td>${a.sets} × ${a.reps}</td><td>${b.sets} × ${b.reps}</td><td>—</td></tr><tr><td>训练容量</td><td>${av} kg</td><td>${bv} kg</td><td>${bv-av>=0?'+':''}${bv-av} kg</td></tr></tbody></table>`}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el){e.preventDefault();actions[el.dataset.action]?.(el)}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.field){const it=draft.items[+el.dataset.index];if(el.dataset.field==='unit')it.unit=el.value;else if(el.dataset.field==='rest')it.rest=+el.value*(it.unit==='minutes'?60:1);else it[el.dataset.field]=+el.value;syncDraft();render()}if(el.dataset.actual){const it=state.newRecord.items[+el.dataset.index];it[el.dataset.actual]=+el.value;it.actualSets||=Array.from({length:it.sets},()=>({weight:it.weight,reps:it.reps}));it.actualSets[+el.dataset.set][el.dataset.actual]=+el.value}if(el.id==='day-workout'){draft=el.value==='rest'?{id:'rest',items:[]}:structuredClone(workout(el.value));render()}if(el.id==='progress-exercise'){state.progressId=el.value;render()}if(el.id==='compare-a'||el.id==='compare-b')updateCompare()});
document.addEventListener('input',e=>{if(e.target.id==='picker-query')$('#picker-results').innerHTML=pickerRows(e.target.value);if(e.target.id==='library-query'){const value=e.target.value,caret=e.target.selectionStart;state.query=value;render();$('#library-query').focus();$('#library-query').setSelectionRange(caret,caret)}});
document.addEventListener('submit',async e=>{e.preventDefault();if(e.target.id==='workout-form'){syncDraft();if(!draft.items.length){toast('先添加至少一个动作');return}const i=db.workouts.findIndex(w=>w.id===draft.id);delete draft.isNew;i<0?db.workouts.push(structuredClone(draft)):db.workouts[i]=structuredClone(draft);save();go('workouts');toast('训练内容已保存')}if(e.target.id==='record-form'){syncDraft();const r=structuredClone(state.newRecord);r.minutes=r.minutes===''?null:+r.minutes;const i=db.records.findIndex(x=>x.id===r.id);i<0?db.records.push(r):db.records[i]=r;state.month=r.date.slice(0,7);state.recordId=r.id;state.recordView='calendar';save();go('records');toast('实际训练已保存，计划保持原样')}if(e.target.id==='exercise-form'){const file=$('#custom-file').files[0],id='custom'+Date.now(),name=$('#custom-name').value.trim();if(!name)return;let src=A['default-exercise'];if(file){src=await new Promise(resolve=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.readAsDataURL(file)})}A[id]=src;db.customExercises||=[];db.customExercises.push({id,name,part:$('#custom-part').value,equipment:$('#custom-equipment').value,muscles:$('#custom-muscles').value.split('、').filter(Boolean),secondary:[],measure:'weight',image:src});save();state.libraryPart='全部';state.query=name;go('library');toast('自定义动作已保存，未上传时使用默认图')}});
for(const e of db.customExercises||[])A[e.id]=e.image;
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog'))$('#dialog').close()});window.addEventListener('hashchange',render);let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(state.recordView==='insights'&&['records','insights'].includes(location.hash.slice(1)))render()},120)});render();
</script></body></html>
